<script>

function alternarMusica(id, boton) {

    let musica = document.getElementById(id);

    if (musica.paused) {
        musica.play();
        boton.innerHTML = "⚔️ Pausar Musica";
    } else {
        musica.pause();
        boton.innerHTML = "💍 Pausar Musica";
    }

}

</script>
